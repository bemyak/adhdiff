[package]
name = "adhdiff"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["bemyak"]
description = "Agent-annotated diff review CLI with desktop and terminal UIs"
repository.workspace = true
readme = "README.md"
keywords = ["diff", "code-review", "tui", "tree-sitter", "llm"]
categories = ["development-tools", "command-line-utilities"]
rust-version.workspace = true

[workspace]
members = ["shared", "frontend"]

[workspace.package]
repository = "https://github.com/bemyak/adhdiff"
rust-version = "1.90"

[features]
default = ["custom-protocol"]
# Embed frontend/dist; without it the window loads tauri.conf.json's devUrl.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
adhdiff-shared = { path = "shared" }
anyhow = "1"
sha2 = "0.10"
tree-sitter-language-pack = { version = "1.22", default-features = false }
tree-sitter = "0.27"
ratatui = "0.30.2"
crossterm = "0.29.0"
hex = "0.4"
tauri = { version = "2", features = [] }
tree-sitter-highlight = "0.27"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = "thin"
