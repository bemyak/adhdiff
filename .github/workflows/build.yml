name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Install WebKitGTK deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf

      # tauri-build reads frontendDist; build it so the root crate compiles
      - uses: taiki-e/install-action@trunk
      - run: trunk build --release
        working-directory: frontend

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude adhdiff-ui --all-targets -- -D warnings
      - run: cargo clippy -p adhdiff-ui --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --exclude adhdiff-ui

  bundle:
    name: ${{ matrix.platform }}
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-24.04
            bundles: deb,appimage
            artifact-paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - platform: linux-arm64
            runs-on: ubuntu-24.04-arm
            bundles: deb,appimage
            artifact-paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - platform: macos-arm64
            runs-on: macos-latest
            bundles: dmg
            artifact-paths: |
              target/release/bundle/dmg/*.dmg
          - platform: windows-x86_64
            runs-on: windows-latest
            bundles: msi,nsis
            artifact-paths: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # rust-cache keys by job id; `key` keeps the matrix legs from sharing
      # one cache. The cargo workspace sits at the repo root (default).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      # prebuilt binary from trunk's releases, no cargo install needed
      - uses: taiki-e/install-action@trunk

      - name: Install WebKitGTK deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf

      - name: Build and bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Build, bundle and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: adhdiff ${{ github.ref_name }}
          releaseDraft: true

      # releases are created only for tag pushes; every run also exposes the
      # bundles as per-target workflow artifacts
      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: adhdiff-${{ matrix.platform }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
