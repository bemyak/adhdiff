[package]
name = "adhdiff-ui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["bemyak"]
description = "Leptos frontend for the adhdiff desktop viewer"
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adhdiff-shared = { path = "../shared" }
leptos = { version = "=0.8.22", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "Node",
    "NodeList",
    "Performance",
    "PointerEvent",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Storage",
    "WheelEvent",
    "Window",
] }
